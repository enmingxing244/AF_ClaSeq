# Column Shuffle Pipeline Configuration Template
#
# This file provides a template for configuring the column shuffle pipeline.
# Replace all paths with your actual file locations.

general:
  # Protein name (used for output naming)
  protein_name: "ProteinName"

  # Base output directory (all results will be saved here)
  base_dir: "/fs/ess/PAA0203/xing244/AF_ClaSeq/results_updated/ProteinName/column_shuffle"

  # Path to structure metrics JSON config file
  # This file defines which structural metrics to calculate (TM-score, RMSD, etc.)
  config_file: "/fs/ess/PAA0203/xing244/AF_ClaSeq/configs/protein_metrics.json"

  # Random seed for reproducibility
  random_seed: 42

  # Use composite metrics (if defined in config_file)
  use_composite_metrics: false

  # State 1 inputs
  state1_pdb: "/path/to/state1.pdb"
  state1_a3m: "/path/to/state1.a3m"
  state1_name: "state1"  # Name for this conformational state

  # State 2 inputs
  state2_pdb: "/path/to/state2.pdb"
  state2_a3m: "/path/to/state2.a3m"
  state2_name: "state2"  # Name for this conformational state

  # Column shuffle parameters
  num_shuffles: 20  # Number of shuffled MSA replicates to generate per state
  contact_threshold: 0.8  # Threshold for identifying unique contact pairs
  sigmoid_center: 8.0  # Distance (Å) at which sigmoid normalization = 0.5
  sigmoid_steepness: 1.0  # Steepness of sigmoid normalization
  min_sequence_separation: 10  # Minimum residue separation for contact pairs
  unique_pair_residue_range: null  # Optional [start, end] range to filter unique pairs (e.g., [1, 100]), null = no filtering

  # Chain IDs in PDB structures (used for interaction validation)
  state1_chain_id: "A"  # Chain ID for state1 PDB (default: "A")
  state2_chain_id: "A"  # Chain ID for state2 PDB (default: "A")

# SLURM job submission configuration
slurm:
  # Path to ColabFold conda environment
  conda_env_path: "/fs/ess/PAA0203/xing244/.conda/envs/colabfold"

  # SLURM account
  slurm_account: "PAA0203"

  # SLURM partition
  slurm_partition: "nextgen"

  # Time limit per job (HH:MM:SS)
  slurm_time: "01:00:00"

  # Resources per job
  slurm_nodes: 1
  slurm_gpus_per_task: 1
  slurm_cpus_per_task: 8

  # Maximum number of concurrent jobs
  max_workers: 200

  # ColabFold prediction parameters
  num_models: 5          # Number of ranked models to output per prediction
  num_seeds: 8           # Number of random initializations (increases diversity)

  # SLURM output/error files (use /dev/null to discard)
  slurm_output: "/dev/null"
  slurm_error: "/dev/null"

  # Number of tasks
  slurm_tasks: 1

# Plotting configuration
plotting:
  # Metric names (must match columns in structure analysis CSV)
  metric1_name: "state1_tmscore"  # X-axis metric
  metric2_name: "state2_tmscore"  # Y-axis metric

  # Color gradients for metrics (start and end colors)
  metric1_color: ["#F2E7F1", "#AD7BAF"]  # Light to dark purple
  metric2_color: ["#AFD2D0", "#468F8B"]  # Light to dark teal

  # Axis limits (metric1 = X-axis, metric2 = Y-axis)
  metric1_min: 0.4
  metric1_max: 1.0
  metric2_min: 0.4
  metric2_max: 1.0

  # Axis ticks (optional - leave out for automatic ticks)
  metric1_ticks: [0.4, 0.6, 0.8, 1.0]
  metric2_ticks: [0.4, 0.6, 0.8, 1.0]


