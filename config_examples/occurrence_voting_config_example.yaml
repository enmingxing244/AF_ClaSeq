# Occurrence Voting Workflow Configuration
# Example configuration for AF_ClaSeq occurrence voting analysis

# General workflow settings
general:
  source_a3m: "/fs/ess/PAA0203/xing244/AF_ClaSeq/results_updated/ABL1/ABL1_P00519.a3m"
  base_dir: "/fs/ess/PAA0203/xing244/AF_ClaSeq/results_updated/ABL1/occurrence_voting_analysis"
  protein_name: "ABL1"
  random_seed: 42  # For reproducible random sampling

# Random sampling configuration
sampling:
  num_groups: 1000      # Number of random groups to create
  group_size: 8         # Number of sequences per group (excluding query)
  num_batches: 10       # Number of SLURM batches to organize groups into

# Structure prediction settings
structure_prediction:
  num_models: 1         # Number of ColabFold models per prediction
  num_seeds: 1          # Number of ColabFold seeds per prediction

# Structure analysis configuration
structure_analysis:
  config_json: "/fs/ess/PAA0203/xing244/AF_ClaSeq/results_updated/ABL1/ABL1_6xrg_6xr6_composite_rmsd.json"
  plddt_threshold: 0                   # Minimum pLDDT threshold for structure inclusion

# Structure filtering configuration
filtering:
  metric_name: "6xr6_composite_rmsd"   # Metric to use for filtering (from structure analysis)
  cutoff_value: 3.0                    # Threshold value for filtering
  cutoff_method: "below"               # "above" or "below" - structures below 3.0 RMSD

# Occurrence voting settings
voting:
  top_n_sequences: 100  # Number of top frequent sequences to select as final result

# Plotting configuration
plotting:
  enabled: true                                   # Enable/disable plotting
  metrics_to_plot: ["6xr6_composite_rmsd", "6xrg_composite_rmsd"]  # Specific metrics to plot (empty list = all available)
  plot_types: ["1d", "2d", "occurrence"]         # Plot types: 1d=distributions, 2d=scatter, occurrence=bar graphs
  output_subdir: "plots"                          # Subdirectory for plots

# SLURM job configuration for ColabFold predictions
slurm:
  conda_env_path: "/fs/ess/PAA0203/xing244/.conda/envs/colabfold"
  account: "PAA0203"
  partition: "nextgen"
  time: "00:30:00"      # Time limit per job
  memory: "32G"         # Memory per job
  cpus: 8               # CPUs per job
  max_concurrent_jobs: 90  # Maximum simultaneous jobs

# ============================================================================
# Configuration Notes:
# ============================================================================
#
# Workflow Overview:
# 1. Random Sampling: Create many small groups by randomly sampling sequences
# 2. Batch Organization: Distribute groups across SLURM batches for efficiency
# 3. Structure Prediction: Use ColabFold to predict structures for each group
# 4. Structure Analysis: Analyze predicted structures using existing AF_ClaSeq utilities
# 5. Structure Filtering: Filter analyzed structures by metric cutoffs
# 6. Sequence Collection: Collect sequences from A3M files of good structures
# 7. Occurrence Voting: Count sequence occurrences and rank by frequency
# 8. Final Selection: Select top N most frequent sequences
#
# Sampling Strategy:
# - num_groups: Total number of random samples to create
# - group_size: Sequences per group (not including query sequence)
# - If num_groups * group_size > available sequences, will use replacement
# - Random seed ensures reproducible sampling
#
# Batch Organization:
# - num_batches: Controls SLURM job parallelization
# - Groups are distributed evenly across batches
# - Each batch becomes one SLURM job
# - Fewer batches = fewer jobs but longer runtime per job
#
# Structure Analysis:
# - config_json: JSON file defining metrics to calculate (same format as other workflows)
# - plddt_threshold: Minimum pLDDT score for structure inclusion
#
# Structure Filtering:
# - metric_name: Must be defined in the structure analysis JSON config
# - cutoff_method: "below" for RMSD (lower is better), "above" for scores (higher is better)
#
# Resource Estimation:
# - Total A3M files created: num_groups (1000 in this example)
# - Total SLURM jobs: num_batches (10 in this example)
# - Groups per batch: num_groups / num_batches = 100 groups per batch
# - Total structures predicted: num_groups * num_models = 1000 structures
#
# Expected Output Files:
# - groups/: Individual group A3M files (group_000001.a3m, etc.)
# - batches/: Organized batch directories for SLURM submission
# - results/occurrence_counts.csv: All sequences ranked by frequency
# - results/top_sequences.a3m: Final top N sequences
# - results/occurrence_voting_summary.txt: Detailed analysis report
#
# Workflow Dependencies:
# - Source A3M file must exist and contain multiple sequences
# - Structure analysis JSON config must exist (defining metrics to calculate)
# - SLURM environment must be properly configured
# - ColabFold conda environment must be available
# ============================================================================