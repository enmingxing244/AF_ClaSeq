# Leave-One-Out Impact Analysis Configuration
# Example configuration file for AF_ClaSeq leave-one-out workflow

# General workflow settings
general:
  source_a3m: "/fs/ess/PAA0203/xing244/AF_ClaSeq/results_updated/ABL1/ABL1_P00519.a3m"
  base_dir: "/fs/ess/PAA0203/xing244/AF_ClaSeq/results_updated/ABL1/leave_one_out_analysis"
  structure_analysis_config: "/fs/ess/PAA0203/xing244/AF_ClaSeq/results_updated/ABL1/ABL1_6xrg_6xr6_composite_rmsd.json"
  protein_name: "ABL1"
  random_seed: 42  # For reproducible sequence grouping

# Leave-one-out specific settings
leave_one_out:
  num_seq_per_group: 8  # Number of sequences per group (excluding query)
  impact_metric_name: "6xr6_composite_rmsd"  # Must match metric in structure_analysis_config
  impact_threshold: 1.0  # Threshold for significant impact
  cutoff_method: "above"  # "above" for metrics where higher impact = better contribution
                         # "below" for metrics where lower impact = better contribution

  # Additional filtering on full group mean values
  full_group_mean_threshold: 3.0  # Filter groups based on their full ensemble mean
  full_mean_cutoff_method: "below"  # "below" to select groups with good initial predictions

  min_sequences_for_loo: 3  # Minimum sequences needed to perform LOO analysis

# SLURM job configuration for ColabFold predictions
slurm:
  conda_env_path: "/fs/ess/PAA0203/xing244/.conda/envs/colabfold"
  account: "PAA0203"
  partition: "nextgen"
  time: "00:30:00"  # Time limit per job
  memory: "32G"     # Memory per job
  cpus: 8           # CPUs per job
  max_concurrent_jobs: 90  # Maximum simultaneous jobs
  num_models: 5     # Number of models per ColabFold prediction (required for LOO)
  num_seeds: 1      # Number of seeds per prediction

# Plotting and visualization settings
plotting:
  output_dir: null  # If null, will use base_dir/leave_one_out/plots
  figsize: [12, 6]  # Figure size for plots [width, height]
  dpi: 150          # Plot resolution
  show_plots: false # Whether to display plots interactively

# ============================================================================
# Configuration Notes:
# ============================================================================
#
# Impact Metric Selection:
# - Must be defined in the structure_analysis_config JSON file
# - Can be a basic metric (RMSD, TM-score) or composite metric
# - Common choices: "composite_rmsd", "6xr6_composite_rmsd", "tm_score"
#
# Impact Score Interpretation:
# - Impact Score = LOO_mean - Full_mean
# - Positive impact: removing sequence makes metric worse (sequence helps)
# - Negative impact: removing sequence makes metric better (sequence hurts)
#
# Cutoff Method Guidelines:
# - For RMSD metrics: use "above" to find sequences that reduce RMSD
# - For TM-score metrics: use "below" to find sequences that increase TM-score
# - For custom metrics: consider whether higher or lower values are better
#
# Resource Planning:
# - Total A3M files created: num_groups * (1 + num_seq_per_group)
# - Total ColabFold jobs: num_groups
# - Each job predicts: 1 full group + num_seq_per_group LOO subsets
# - Total structures: num_groups * (1 + num_seq_per_group) * num_models
#
# Example Calculation for 100 sequences:
# - Groups created: ~12 groups (8 sequences each, last group merged)
# - A3M files: 12 * (1 + 8) = 108 files
# - ColabFold jobs: 12 jobs
# - Total structures: 12 * 9 * 5 = 540 structures
# ============================================================================