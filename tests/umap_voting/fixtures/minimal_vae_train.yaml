general:
  protein_name: "TEST"
  base_dir: "/tmp/umap_voting_test/vae"
  random_seed: 42
  device: "cpu"
inputs:
  structures_csv: "/tmp/structures.csv"
  references_csv: "/tmp/references.csv"
structure_analysis:
  config_json: "/tmp/structure_analysis.json"
  coord_target: "local"
vae:
  model:
    latent_dim: 8
    hidden_channels: [16, 32]
    use_residual: true
  training:
    epochs: 5
    batch_size: 8
    learning_rate: 1.0e-3
    kl_weight: 0.1
    val_split: 0.1
    save_best_only: true
    early_stopping_patience: 50
output:
  embedding_filename: "embedding.npz"
  save_checkpoints_every: 200
