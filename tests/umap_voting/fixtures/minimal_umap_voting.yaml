general:
  protein_name: "TEST"
  base_dir: "/tmp/umap_voting_test/voting"
  random_seed: 42
inputs:
  embedding_npz: "/tmp/embedding.npz"
  references_csv: "/tmp/references.csv"
  query_a3m: "/tmp/query.a3m"
umap:
  n_neighbors: 30
  min_dist: 0.1
  n_components: 2
  metric: "euclidean"
  umap1_range: [1.0, 11.0]
  umap2_range: [1.0, 9.0]
binning:
  bin_size: 1.0
  top_k: 16
  min_records_per_bin: 50
structure_prediction:
  num_models: 5
  num_seeds: 8
  num_recycle: 3
  prediction_mode: "monomer"
  rank: "plddt"
  random_seed: 0
slurm:
  conda_env_path: "/tmp/fakeenv"
  account: "TEST"
  partition: "nextgen"
  time: "00:30:00"
  gpus_per_task: 1
  cpus_per_task: 4
  check_interval: 60
structure_analysis:
  config_json: "/tmp/structure_analysis.json"
  metrics: ["local", "global"]
plotting:
  formats: ["png", "pdf"]
  metric_ranges:
    local:  { min: 0, max: 6, ticks: [0, 1, 2, 3, 4, 5, 6] }
    global: { min: 0, max: 4, ticks: [0, 1, 2, 3, 4] }
  colors:
    ref1: "#C73E3A"
    ref2: "#2E7AB8"
  panels_per_row: 2
