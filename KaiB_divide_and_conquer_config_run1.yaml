# Divide and Conquer Phylogenetic Workflow Configuration
# Main configuration file in YAML format for better readability

# Input files and binaries
input:
  a3m_file: "/fs/ess/PAA0203/xing244/afclaseq_divide_and_conquer/dac_loo_simple/results/KaiB/default/KaiB_DeepMSA2_8340seqs.a3m"
  fasttree_binary: "/fs/ess/PAA0203/xing244/packages/FastTree/FastTreeMP"

output:
  # Working directory - will create 'divide_and_conquer' subdirectory within this
  working_dir: "/fs/ess/PAA0203/xing244/afclaseq_divide_and_conquer/dac_loo_simple/results/KaiB/run1"
# Phylogenetic tree construction and clade splitting
clade_splitting:
  min_clade_size: 40      # Minimum sequences per clade
  max_clade_size: 100     # Maximum sequences per clade (larger clades will be subdivided using branch distances)

# Random shuffling and grouping within clades
shuffling:
  num_shuffles: 5        # Number of random shuffles per clade
  group_size: 8          # Number of sequences per group
  random_seed: 42         # Random seed for reproducibility (optional)

# ColabFold structure prediction settings
colabfold:
  conda_env: "colabfold"  # Conda environment name
  num_models: 1           # Number of models per prediction
  num_seeds: 1            # Number of seeds per prediction
  max_concurrent_jobs: 90 # Maximum concurrent SLURM jobs

# SLURM job configuration
slurm:
  account: "PAA0203"      # SLURM account
  partition: "nextgen"    # SLURM partition
  time: "00:30:00"        # Job time limit
  memory: "32G"           # Memory per job
  cpus: 8                 # CPUs per job

# Structure analysis configuration
structure_analysis:
  config_file: "/fs/ess/PAA0203/xing244/afclaseq_divide_and_conquer/dac_loo_simple/results/KaiB/configs/config_2qke_5jyt_tmscore.json"  # JSON config for metrics and analysis
  plddt_threshold: 0     # Minimum pLDDT score for structure inclusion

# Plotting and visualization
plotting:
  metrics:                # List of metrics to plot
    - "2qke_tmscore"
    - "5jyt_tmscore"

  plot_types:             # Types of plots to generate
    - "1d"                # 1D distribution plots
    - "2d"                # 2D scatter plots
    - "correlation"       # Correlation plots
  
  # Color schemes for different metrics
  colors:
    2qke_tmscore: ["#87CEEB", "#87ebe1"]     # Sky blue to white
    5jyt_tmscore: ["#87CEEB", "#87ebe1"]       # Light pink to white
   
  
  # Range and ticks for each metric (applies to both x and y axis depending on plot context)
  metric_ranges:
    2qke_tmscore:
      min: 0.4
      max: 1
      ticks: [0.4, 0.6, 0.8, 1.0]
    5jyt_tmscore:
      min: 0.4
      max: 1
      ticks: [0.4, 0.6, 0.8, 1.0]
  
  # Plot-specific parameters
  plot_params:
    1d:
      n_plot_bins: 50     # Number of histogram bins
      figsize: [10, 5]    # Figure size [width, height]
      log_scale: false    # Use log scale for y-axis
      show_bin_lines: true  # Show vertical lines at bin edges
    2d:
      color_metric: "plddt"  # Metric to use for point coloring